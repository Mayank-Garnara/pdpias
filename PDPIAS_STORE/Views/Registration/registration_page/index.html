<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Tabs Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h2 class="mb-4">Tabbed Navigation Example</h2>
  
  <!-- Nav tabs -->
  <ul class="nav nav-tabs" id="myTab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home" type="button" role="tab">
        Home
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button" role="tab">
        Profile
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button" role="tab">
        Contact
      </button>
    </li>
  </ul>

  <!-- Tab panes -->
  <div class="tab-content mt-3">
    <div class="tab-pane fade show active" id="home" role="tabpanel">
      <h4>Welcome to Home</h4>
      <p>This is the home tab content. It appears when you click on "Home".</p>
    </div>
    <div class="tab-pane fade" id="profile" role="tabpanel">
      <h4>User Profile</h4>
      <p>This section contains user profile information.</p>
    </div>
    <div class="tab-pane fade" id="contact" role="tabpanel">
      <h4>Contact Us</h4>
      <p>This section includes contact details or a contact form.</p>
    </div>
  </div>
</div>

<!-- Bootstrap JS CDN (including Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
